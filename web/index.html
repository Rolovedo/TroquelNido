<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIDO · Generador de troquel</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #263238;
      background: #f5f2eb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1120px, 100%); margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 6px; color: #245c43; }
    .intro { margin-top: 0; color: #526057; }
    .layout { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 20px; align-items: start; }
    .card { background: white; border: 1px solid #ded8cb; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px #0000000d; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid #b9c3bc; border-radius: 7px; font: inherit; }
    input:focus, select:focus { outline: 2px solid #82b89c; border-color: #347b57; }
    button { border: 0; background: #347b57; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #286343; }
    button:disabled { cursor: wait; opacity: .65; }
    .secondary { margin-top: 10px; background: #e8eee9; color: #245c43; }
    .secondary:hover { background: #d7e5da; }
    .status { min-height: 24px; margin: 12px 0 0; color: #b34d00; }
    .preview { min-height: 300px; overflow: auto; border: 1px solid #ded8cb; border-radius: 8px; background: #fff; padding: 8px; }
    .preview svg { display: block; width: 100%; height: auto; }
    .empty { color: #69756e; text-align: center; padding: 100px 16px; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    @media (max-width: 760px) {
      main { padding-top: 16px; }
      .layout { grid-template-columns: 1fr; }
      .preview { min-height: 220px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>NIDO · Generador de troquel</h1>
    <p class="intro">Diseña un embalaje de cartón de una pieza, sin pegante ni relleno sintético.</p>

    <div class="layout">
      <form id="troquel-form" class="card">
        <div class="field">
          <label for="tipo">Tipo de producto</label>
          <select id="tipo" name="tipo" required></select>
        </div>
        <div class="field">
          <label for="material">Material del producto</label>
          <select id="material" name="material" required></select>
        </div>
        <div class="field">
          <label for="unidad">Unidad de medida</label>
          <select id="unidad" name="unidad">
            <option value="mm">Milímetros (mm)</option>
            <option value="cm">Centímetros (cm)</option>
          </select>
        </div>
        <div class="field">
          <label for="largo">Largo</label>
          <input id="largo" name="largo" type="number" min="0.1" step="any" required>
        </div>
        <div class="field">
          <label for="ancho">Ancho</label>
          <input id="ancho" name="ancho" type="number" min="0.1" step="any" required>
        </div>
        <div class="field">
          <label for="alto">Alto</label>
          <input id="alto" name="alto" type="number" min="0.1" step="any" required>
        </div>
        <div class="field">
          <label for="peso">Peso (kg, opcional)</label>
          <input id="peso" name="peso" type="number" min="0.001" step="any">
        </div>
        <div class="field">
          <label for="g">Holgura g (mm, opcional)</label>
          <input id="g" name="g" type="number" min="0" step="any">
        </div>
        <div class="field">
          <label for="d">Profundidad d del panal (mm, opcional)</label>
          <input id="d" name="d" type="number" min="0" step="any">
        </div>
        <div class="field">
          <label for="ancho_hoja">Ancho disponible de hoja (mm, opcional)</label>
          <input id="ancho_hoja" name="ancho_hoja" type="number" min="1" step="any">
        </div>
        <div class="field">
          <label for="alto_hoja">Alto disponible de hoja (mm, opcional)</label>
          <input id="alto_hoja" name="alto_hoja" type="number" min="1" step="any">
        </div>
        <div class="field">
          <label for="flauta">Flauta (opcional)</label>
          <select id="flauta" name="flauta">
            <option value="">Automática según el peso</option>
          </select>
        </div>
        <button id="generate" type="submit">Generar troquel</button>
        <button id="download" class="secondary" type="button" disabled>Descargar SVG</button>
        <button id="download-png" class="secondary" type="button" disabled>Descargar PNG</button>
        <button id="download-pdf" class="secondary" type="button" disabled>Descargar PDF 1:1</button>
        <button id="download-tapa" class="secondary" type="button" disabled>Descargar tapa SVG</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section class="card">
        <h2>Vista previa de los SVG</h2>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <div>
            <h3>Troquel</h3>
            <div id="preview" class="preview">
              <p class="empty">Completa las medidas para ver el troquel.</p>
            </div>
          </div>
          <div>
            <h3>Tapa externa</h3>
            <div id="preview-tapa" class="preview">
              <p class="empty">La tapa se mostrará aquí.</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>
  <script>
    const API_URL = "";
    const form = document.querySelector("#troquel-form");
    const tipo = document.querySelector("#tipo");
    const material = document.querySelector("#material");
    const unidad = document.querySelector("#unidad");
    const flauta = document.querySelector("#flauta");
    const preview = document.querySelector("#preview");
    const previewTapa = document.querySelector("#preview-tapa");
    const status = document.querySelector("#status");
    const generate = document.querySelector("#generate");
    const download = document.querySelector("#download");
    const downloadPng = document.querySelector("#download-png");
    const downloadPdf = document.querySelector("#download-pdf");
    const downloadTapa = document.querySelector("#download-tapa");
    let svg = "";
    let svgTapa = "";

    function actualizarRango() {
      const esCm = unidad.value === "cm";
      for (const campo of ["largo", "ancho", "alto"]) {
        document.querySelector(`#${campo}`).min = esCm ? "1" : "10";
        document.querySelector(`#${campo}`).max = esCm ? "100" : "1000";
      }
    }

    function cargarOpciones(opciones) {
      for (const [select, valores] of [[tipo, opciones.tipos], [material, opciones.materiales]]) {
        select.replaceChildren(...valores.map(valor => new Option(valor, valor)));
      }
      flauta.append(...opciones.flautas.map(valor => new Option(valor, valor)));
    }

    async function leerError(response) {
      try {
        const body = await response.json();
        return typeof body.detail === "string" ? body.detail : "No se pudo generar el troquel.";
      } catch {
        return `Error del servidor (${response.status}).`;
      }
    }

    async function iniciar() {
      try {
        const response = await fetch(`${API_URL}/opciones`);
        if (!response.ok) throw new Error(await leerError(response));
        cargarOpciones(await response.json());
      } catch (error) {
        status.textContent = `No se pudieron cargar las opciones: ${error.message}`;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      status.textContent = "";
      generate.disabled = true;
      download.disabled = true;
      downloadPng.disabled = true;
      downloadPdf.disabled = true;
      downloadTapa.disabled = true;
      const datos = Object.fromEntries(new FormData(form));
      datos.encastre = true;
      for (const campo of ["largo", "ancho", "alto"]) datos[campo] = Number(datos[campo]);
      for (const campo of ["peso", "g", "d", "ancho_hoja", "alto_hoja"]) {
        if (datos[campo] === "") delete datos[campo];
        else datos[campo] = Number(datos[campo]);
      }
      if (datos.flauta === "") delete datos.flauta;

      try {
        const response = await fetch(`${API_URL}/troquel`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(datos)
        });
        if (!response.ok) throw new Error(await leerError(response));
        const resultado = await response.json();
        svg = resultado.svg;
        svgTapa = resultado.tapa ? resultado.tapa.svg : "";
        preview.innerHTML = svg;
        previewTapa.innerHTML = svgTapa || '<p class="empty">La tapa no está disponible.</p>';
        download.disabled = false;
        downloadPng.disabled = false;
        downloadPdf.disabled = false;
        downloadTapa.disabled = !svgTapa;
        const advertencias = resultado.medidas.advertencias || [];
        if (advertencias.length) {
          status.textContent = `⚠ ${advertencias.join(" ")}`;
          status.style.color = "#b34d00";
        } else {
          status.textContent = "Troquel generado correctamente.";
          status.style.color = "#347b57";
        }
      } catch (error) {
        svg = "";
        status.textContent = `No se pudo generar el troquel: ${error.message}`;
        preview.innerHTML = '<p class="empty">No hay una vista previa disponible.</p>';
        downloadPng.disabled = true;
        downloadPdf.disabled = true;
      } finally {
        generate.disabled = false;
      }
    });

    unidad.addEventListener("change", actualizarRango);
    download.addEventListener("click", () => {
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(new Blob([svg], {type: "image/svg+xml"}));
      enlace.download = "nido_troquel.svg";
      enlace.click();
      URL.revokeObjectURL(enlace.href);
    });

    downloadTapa.addEventListener("click", () => {
      if (!svgTapa) return;
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(new Blob([svgTapa], {type: "image/svg+xml"}));
      enlace.download = "nido_tapa.svg";
      enlace.click();
      URL.revokeObjectURL(enlace.href);
    });

    function dimensionesSvg() {
      const nodo = new DOMParser().parseFromString(svg, "image/svg+xml").documentElement;
      const viewBox = nodo.getAttribute("viewBox").trim().split(/\s+/).map(Number);
      if (viewBox.length !== 4 || viewBox.some(Number.isNaN) || viewBox[2] <= 0 || viewBox[3] <= 0) {
        throw new Error("El SVG no tiene dimensiones válidas.");
      }
      return { nodo, ancho: viewBox[2], alto: viewBox[3] };
    }

    function descargarBlob(blob, nombre) {
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(blob);
      enlace.download = nombre;
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(enlace.href), 0);
    }

    downloadPng.addEventListener("click", async () => {
      try {
        const { ancho, alto } = dimensionesSvg();
        const imagen = new Image();
        const url = URL.createObjectURL(new Blob([svg], {type: "image/svg+xml"}));
        imagen.onload = () => {
          const escala = 96 / 25.4;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(ancho * escala);
          canvas.height = Math.ceil(alto * escala);
          canvas.getContext("2d").drawImage(imagen, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => {
            if (blob) descargarBlob(blob, "nido_troquel.png");
          }, "image/png");
          URL.revokeObjectURL(url);
        };
        imagen.onerror = () => {
          URL.revokeObjectURL(url);
          throw new Error("No se pudo convertir el SVG a PNG.");
        };
        imagen.src = url;
      } catch (error) {
        status.textContent = `No se pudo exportar el PNG: ${error.message}`;
      }
    });

    downloadPdf.addEventListener("click", async () => {
      try {
        if (!window.jspdf || typeof window.jspdf.jsPDF !== "function") {
          throw new Error("No se cargaron las herramientas de exportación PDF.");
        }
        const { nodo, ancho, alto } = dimensionesSvg();
        const orientacion = ancho > alto ? "landscape" : "portrait";
        const pdf = new window.jspdf.jsPDF({
          orientation: orientacion,
          unit: "mm",
          format: [ancho, alto]
        });
        if (typeof pdf.svg !== "function") {
          throw new Error("La conversión SVG a PDF no está disponible.");
        }
        await pdf.svg(nodo, {x: 0, y: 0, width: ancho, height: alto});
        pdf.save("nido_troquel.pdf");
      } catch (error) {
        status.textContent = `No se pudo exportar el PDF: ${error.message}`;
      }
    });

    actualizarRango();
    iniciar();
  </script>
</body>
</html>
